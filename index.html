<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HH Goa 2026 — Official Frame &amp; Pass Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --amber: #ffb648;
    --coral: #ff5e62;
    --gold: #ffe082;
    --teal: #00f2fe;
    --deep: #160724;
    --card: rgba(22, 10, 36, 0.9);
    --border: rgba(255, 182, 72, 0.25);
    --ink: #fdf8ff;
    --muted: #bdaece;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(165deg, #12061e 0%, #2b0c3f 35%, #611e4f 70%, #d6544a 100%);
    color: var(--ink);
    padding: 12px 10px 40px;
    overflow-x: hidden;
  }

  .wrap { max-width: 490px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    font-weight: 800;
    color: #1a0a02;
    background: linear-gradient(135deg, var(--amber), var(--gold));
    padding: 4px 14px;
    border-radius: 999px;
    box-shadow: 0 0 16px rgba(255, 182, 72, 0.4);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 900;
    margin: 0 0 2px;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 30%, var(--amber) 70%, #ff8c52 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { color: var(--muted); font-size: 13px; margin: 0; }

  /* Tabs Switcher */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.3);
    padding: 4px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    backdrop-filter: blur(12px);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s var(--ease);
    user-select: none;
  }

  .tab.active {
    background: linear-gradient(135deg, var(--amber), var(--gold));
    color: #1c0c02;
    box-shadow: 0 4px 14px rgba(255, 182, 72, 0.4);
  }

  /* Controls Box ABOVE Canvas */
  .controls-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 12px;
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }

  /* Upload & Camera Buttons */
  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .btn-upload, .btn-camera {
    padding: 11px 8px;
    border-radius: 12px;
    border: 1px dashed rgba(255, 182, 72, 0.4);
    background: rgba(255, 182, 72, 0.08);
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s var(--ease);
  }

  .btn-upload:hover, .btn-camera:hover {
    border-color: var(--amber);
    background: rgba(255, 182, 72, 0.2);
    color: var(--amber);
  }
  input[type=file] { display: none; }

  /* Options Row */
  .opt-row {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .shapes-row {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .shape-btn {
    flex: 1;
    padding: 6px 2px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }

  .shape-btn.active {
    background: rgba(255, 182, 72, 0.25);
    border-color: var(--amber);
    color: var(--amber);
  }

  .theme-swatches {
    display: flex;
    gap: 6px;
  }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s var(--ease);
  }

  .swatch.active {
    border-color: #ffffff;
    transform: scale(1.15);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  }

  /* Sliders Grid ABOVE Canvas */
  .sliders-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: rgba(0, 0, 0, 0.3);
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .slider-item { display: flex; flex-direction: column; gap: 2px; }
  .slider-item label { font-size: 10.5px; color: var(--muted); font-weight: 700; }
  .slider-item input[type=range] { width: 100%; accent-color: var(--amber); }

  /* Mode B Inputs */
  .mode-b-fields {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .mode-b-fields input, .mode-b-fields select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #11071c;
    color: var(--ink);
    font-size: 12.5px;
    outline: none;
  }

  /* Vibe Alert Tag */
  .vibe-tag {
    display: none;
    text-align: center;
    font-size: 11.5px;
    font-weight: 800;
    color: #ffe0a3;
    background: rgba(255, 182, 72, 0.18);
    border: 1px solid rgba(255, 182, 72, 0.4);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  /* Canvas Image Card */
  .canvas-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: #080312;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    aspect-ratio: 1 / 1;
  }

  .canvas-wrap canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #bgCanvas { z-index: 1; pointer-events: none; }
  #canvas { z-index: 2; background: transparent; touch-action: none; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  /* Action Buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  button.main-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s var(--ease);
  }

  button.main-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button.main-btn:active { transform: scale(0.96); }

  .btn-dl {
    background: linear-gradient(135deg, var(--amber), var(--gold));
    color: #1e0d02;
    box-shadow: 0 4px 14px rgba(255, 182, 72, 0.35);
  }

  .btn-share {
    background: #000;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }

  .btn-copy {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  /* Selfie Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }

  .modal.show { display: flex; }

  .modal-card {
    background: #180a2b;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .video-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    margin: 10px 0;
    border: 2px solid var(--amber);
  }

  video { width: 100%; height: 100%; object-fit: cover; }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 20px;
  }

  footer a { color: var(--amber); text-decoration: none; font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(10px);
    background: #120924;
    border: 1px solid var(--amber);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s var(--ease);
    z-index: 300;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="badge">🌴 HH GOA 2026</div>
    <h1>HH Goa Frame Studio</h1>
    <p>Upload a photo or selfie → customize frame → share to X.</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="A">PFP Frame</div>
    <div class="tab" data-mode="B">VIP Builder Pass</div>
  </div>

  <!-- Controls Box ABOVE Image -->
  <div class="controls-box">
    <div class="action-grid">
      <button class="btn-upload" id="uploadBtn">📁 Upload Photo</button>
      <button class="btn-camera" id="cameraBtn">📸 Take Selfie</button>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif">
    </div>

    <div class="opt-row">
      <div class="shapes-row">
        <div class="shape-btn active" data-shape="circle">Circle</div>
        <div class="shape-btn" data-shape="rounded">Rounded</div>
        <div class="shape-btn" data-shape="hexagon">Hexagon</div>
        <div class="shape-btn" data-shape="square">Square</div>
      </div>
      <div class="theme-swatches" id="themeRow"></div>
    </div>

    <!-- Sliders Grid ABOVE Canvas -->
    <div class="sliders-grid">
      <div class="slider-item">
        <label>🔍 Zoom</label>
        <input type="range" id="zoom" min="80" max="250" value="100">
      </div>
      <div class="slider-item">
        <label>↕ Vertical</label>
        <input type="range" id="posY" min="-100" max="100" value="0">
      </div>
      <div class="slider-item">
        <label>↔ Horizontal</label>
        <input type="range" id="posX" min="-100" max="100" value="0">
      </div>
      <div class="slider-item">
        <label>🔄 Rotate</label>
        <input type="range" id="rot" min="-45" max="45" value="0">
      </div>
    </div>

    <div class="mode-b-fields" id="fieldsB">
      <input type="text" id="fName" placeholder="Name (e.g. Alex)" maxlength="24">
      <input type="text" id="fRole" placeholder="Role (e.g. Solana)" maxlength="24">
      <select id="fBadge" style="grid-column: span 2;">
        <option value="VERIFIED BUILDER">VERIFIED BUILDER</option>
        <option value="TOP HACKER 2026">TOP HACKER 2026</option>
        <option value="GOA SHIPPER">GOA SHIPPER</option>
        <option value="FOUNDER / DEGEN">FOUNDER / DEGEN</option>
      </select>
    </div>
  </div>

  <div class="vibe-tag" id="vibeTag">✨ Auto Vibe Detected: <span id="vibeName">Goa Sunset Anime</span></div>

  <!-- Canvas Image Card -->
  <div class="canvas-card">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="bgCanvas" width="1080" height="1080"></canvas>
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>

    <div class="btn-row">
      <button class="main-btn btn-dl" id="downloadBtn">⬇ Download</button>
      <button class="main-btn btn-share" id="shareBtn">𝕏 Share to X</button>
      <button class="main-btn btn-copy" id="copyLinkBtn">🔗 Copy Link</button>
    </div>
  </div>

  <footer>
    Built for <strong>HH Goa 2026</strong> · <a href="https://twitter.com/hashtag/FrameInGoa" target="_blank">#FrameInGoa</a><br>
    App: <a href="https://hh-goa-2026-frame-omega.vercel.app/" target="_blank">hh-goa-2026-frame-omega.vercel.app</a>
  </footer>
</div>

<!-- Selfie Camera Modal -->
<div class="modal" id="camModal">
  <div class="modal-card">
    <div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;">📸 Take Your Selfie</div>
    <div class="video-wrap">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="main-btn btn-dl" id="snapBtn">📷 Snap Photo</button>
      <button class="main-btn btn-copy" id="closeCamBtn">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
(function(){
  const DEPLOYMENT_URL = "https://hh-goa-2026-frame-omega.vercel.app/";

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const canvasWrap = document.getElementById('canvasWrap');

  const uploadBtn = document.getElementById('uploadBtn');
  const cameraBtn = document.getElementById('cameraBtn');
  const fileInput = document.getElementById('fileInput');

  const zoom = document.getElementById('zoom');
  const posX = document.getElementById('posX');
  const posY = document.getElementById('posY');
  const rot = document.getElementById('rot');

  const fieldsB = document.getElementById('fieldsB');
  const fName = document.getElementById('fName');
  const fRole = document.getElementById('fRole');
  const fBadge = document.getElementById('fBadge');
  const tabs = document.querySelectorAll('.tab');
  const shapeBtns = document.querySelectorAll('.shape-btn');
  const toast = document.getElementById('toast');
  const themeRow = document.getElementById('themeRow');
  const vibeTag = document.getElementById('vibeTag');
  const vibeName = document.getElementById('vibeName');

  const camModal = document.getElementById('camModal');
  const webcam = document.getElementById('webcam');
  const snapBtn = document.getElementById('snapBtn');
  const closeCamBtn = document.getElementById('closeCamBtn');

  let mode = 'A';
  let shape = 'circle';
  let img = null;
  let offsetX = 0.5, offsetY = 0.5, rotationDeg = 0;
  let dragging = false, dragStart = null;
  let mediaStream = null;
  let isAnimeOverlay = false;

  const THEMES = [
    {
      name: 'Goa Sunset Anime',
      sky: ['#17072b', '#3b1049', '#7e2454', '#c94457', '#ff7d4e', '#ffca7a'],
      accentA: '#ff5e62', accentB: '#ffb648', inkOnAccent: '#241003',
      capBg: 'rgba(14, 7, 24, 0.88)', capText: '#ffe8c7',
      water: ['rgba(10, 60, 75, 0.95)', '#041c26'], sand: ['#f6ce9d', '#de9f6b'],
      orb: ['#fff7e0', '#ffd175', '#ff8c42']
    },
    {
      name: 'Neon Cyber Vibe',
      sky: ['#06030c', '#120b30', '#2a104f', '#611068', '#a81895', '#ff38ca'],
      accentA: '#00f2fe', accentB: '#ff2ec4', inkOnAccent: '#060012',
      capBg: 'rgba(6, 4, 15, 0.88)', capText: '#d8f8ff',
      water: ['rgba(6, 28, 44, 0.95)', '#01070e'], sand: ['#2d1c44', '#170b28'],
      orb: ['#ffffff', '#d4f3ff', '#8ab0e6']
    },
    {
      name: 'Tropical Ocean Vibe',
      sky: ['#0b3142', '#14596d', '#228fa0', '#4cc5b9', '#96e8ce', '#e3fff4'],
      accentA: '#ff5e62', accentB: '#ffd166', inkOnAccent: '#1c0f05',
      capBg: 'rgba(5, 36, 42, 0.88)', capText: '#e3fff6',
      water: ['rgba(6, 68, 78, 0.92)', '#012128'], sand: ['#ffe2b3', '#ecc07e'],
      orb: ['#ffffff', '#ffebad', '#ffc04d']
    },
    {
      name: 'Golden Beach Vibe',
      sky: ['#241206', '#4a220d', '#964d19', '#d67e27', '#ffb648', '#ffeaab'],
      accentA: '#ffb648', accentB: '#ff7e33', inkOnAccent: '#261104',
      capBg: 'rgba(26, 12, 4, 0.88)', capText: '#ffe6b8',
      water: ['rgba(12, 65, 60, 0.95)', '#031c1a'], sand: ['#ffd494', '#e59e5c'],
      orb: ['#fffde6', '#ffd675', '#ff8533']
    }
  ];
  let theme = THEMES[0];

  const swatchEls = THEMES.map((th, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = `linear-gradient(135deg, ${th.accentA}, ${th.accentB})`;
    sw.title = th.name;

    sw.addEventListener('click', () => {
      theme = th;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      draw();
    });

    themeRow.appendChild(sw);
    return sw;
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // Auto Vibe Triggered ONLY AFTER Photo Upload
  function autoDetectVibeOnUpload(image) {
    try {
      const s = 16;
      const c = document.createElement('canvas'); c.width = s; c.height = s;
      const cx = c.getContext('2d');
      cx.drawImage(image, 0, 0, s, s);
      const data = cx.getImageData(0, 0, s, s).data;

      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
      }
      r /= count; g /= count; b /= count;
      const brightness = (r + g + b) / 3;
      const warmth = r - b;

      let selectedIndex = 0;
      if (b > r && b > g) selectedIndex = 1;
      else if (g > r && g > b) selectedIndex = 2;
      else if (warmth > 20 && brightness > 120) selectedIndex = 3;
      else selectedIndex = 0;

      theme = THEMES[selectedIndex];
      isAnimeOverlay = true;
      vibeName.textContent = theme.name;
      vibeTag.style.display = 'block';

      swatchEls.forEach((sw, idx) => sw.classList.toggle('active', idx === selectedIndex));
    } catch(e) { /* fallback */ }
  }

  // Fallback Placeholder Avatar
  function createDefaultAvatar() {
    const c = document.createElement('canvas');
    c.width = 400; c.height = 400;
    const cx = c.getContext('2d');
    
    const g = cx.createLinearGradient(0,0,400,400);
    g.addColorStop(0, '#2d1254'); g.addColorStop(1, '#7e2454');
    cx.fillStyle = g; cx.fillRect(0,0,400,400);

    cx.fillStyle = '#ffb648';
    cx.beginPath(); cx.arc(200, 150, 65, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(200, 360, 115, 0, Math.PI*2); cx.fill();

    const avatarImg = new Image();
    avatarImg.onload = () => { img = avatarImg; draw(); };
    avatarImg.src = c.toDataURL();
  }
  createDefaultAvatar();

  // Camera Selfie Logic
  cameraBtn.addEventListener('click', async () => {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      webcam.srcObject = mediaStream;
      camModal.classList.add('show');
    } catch(err) {
      showToast('Camera unavailable');
    }
  });

  function stopCamera() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    camModal.classList.remove('show');
  }

  closeCamBtn.addEventListener('click', stopCamera);

  snapBtn.addEventListener('click', () => {
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = webcam.videoWidth || 640;
    tmpCanvas.height = webcam.videoHeight || 640;
    const tctx = tmpCanvas.getContext('2d');
    tctx.translate(tmpCanvas.width, 0);
    tctx.scale(-1, 1);
    tctx.drawImage(webcam, 0, 0);
    
    const snappedImage = new Image();
    snappedImage.onload = () => {
      img = snappedImage;
      autoDetectVibeOnUpload(snappedImage);
      offsetX = 0.5; offsetY = 0.5;
      zoom.value = 100; posX.value = 0; posY.value = 0; rot.value = 0;
      draw();
      stopCamera();
    };
    snappedImage.src = tmpCanvas.toDataURL('image/jpeg');
  });

  // Canvas Mode Dimensions
  function setDims() {
    const h = mode === 'A' ? 1080 : 1350;
    canvas.height = h; bgCanvas.height = h;
    canvasWrap.style.aspectRatio = `1080 / ${h}`;
  }

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      mode = t.dataset.mode;
      fieldsB.style.display = mode === 'B' ? 'grid' : 'none';
      setDims();
      draw();
    });
  });

  shapeBtns.forEach(sb => {
    sb.addEventListener('click', () => {
      shapeBtns.forEach(x => x.classList.remove('active'));
      sb.classList.add('active');
      shape = sb.dataset.shape;
      draw();
    });
  });

  setDims();

  fName.addEventListener('input', draw);
  fRole.addEventListener('input', draw);
  fBadge.addEventListener('change', draw);

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

  async function handleFile(file) {
    let blob = file;
    if (/heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name)) {
      showToast('Converting HEIC…');
      try { blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 }); }
      catch(err) { showToast('Could not read HEIC — try JPG/PNG'); return; }
    }
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => {
      img = image;
      autoDetectVibeOnUpload(image);
      offsetX = 0.5; offsetY = 0.5;
      zoom.value = 100; posX.value = 0; posY.value = 0; rot.value = 0;
      draw();
    };
    image.src = url;
  }

  zoom.addEventListener('input', draw);
  posX.addEventListener('input', () => { offsetX = (parseFloat(posX.value) + 100) / 200; draw(); });
  posY.addEventListener('input', () => { offsetY = (parseFloat(posY.value) + 100) / 200; draw(); });
  rot.addEventListener('input', () => { rotationDeg = parseFloat(rot.value); draw(); });

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  canvas.addEventListener('pointerdown', e => {
    if (!img) return;
    dragging = true;
    dragStart = { p: pointerPos(e), ox: offsetX, oy: offsetY };
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = pointerPos(e);
    const dx = p.x - dragStart.p.x, dy = p.y - dragStart.p.y;
    offsetX = Math.min(1, Math.max(0, dragStart.ox + dx * 1.2));
    offsetY = Math.min(1, Math.max(0, dragStart.oy + dy * 1.2));
    posX.value = Math.round(offsetX * 200 - 100);
    posY.value = Math.round(offsetY * 200 - 100);
    draw();
  });
  window.addEventListener('pointerup', () => dragging = false);

  // Dynamic Goa Sunset Animated Background
  function drawSunsetPalmScene(t) {
    const w = bgCanvas.width, h = bgCanvas.height;
    const s = theme.sky;
    const g = bgCtx.createLinearGradient(0, 0, 0, h);
    s.forEach((col, idx) => g.addColorStop(idx / (s.length - 1), col));
    bgCtx.fillStyle = g; bgCtx.fillRect(0, 0, w, h);
    
    // Sun
    const sunX = w * 0.76, sunY = h * 0.22;
    const sg = bgCtx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 160);
    sg.addColorStop(0, theme.orb[0]); sg.addColorStop(0.4, theme.orb[1]); sg.addColorStop(1, 'transparent');
    bgCtx.fillStyle = sg; bgCtx.beginPath(); bgCtx.arc(sunX, sunY, 160, 0, Math.PI * 2); bgCtx.fill();

    // Sea
    const seaY = h * 0.72;
    bgCtx.fillStyle = theme.water[0]; bgCtx.fillRect(0, seaY, w, h - seaY);

    // Sand
    const sandY = h * 0.88;
    const sgSand = bgCtx.createLinearGradient(0, sandY, 0, h);
    sgSand.addColorStop(0, theme.sand[0]); sgSand.addColorStop(1, theme.sand[1]);
    bgCtx.fillStyle = sgSand; bgCtx.fillRect(0, sandY, w, h - sandY);
  }

  let animStart = null;
  function animFrame(now) {
    if (!animStart) animStart = now;
    const t = (now - animStart) / 1000;
    drawSunsetPalmScene(t);
    requestAnimationFrame(animFrame);
  }
  requestAnimationFrame(animFrame);

  // Clip Paths
  function applyClipPath(c, cx, cy, r, shapeType) {
    c.beginPath();
    if (shapeType === 'circle') {
      c.arc(cx, cy, r, 0, Math.PI * 2);
    } else if (shapeType === 'rounded') {
      c.roundRect(cx - r, cy - r, r * 2, r * 2, 40);
    } else if (shapeType === 'hexagon') {
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI / 3) - Math.PI / 6;
        const hx = cx + r * Math.cos(a);
        const hy = cy + r * Math.sin(a);
        if (i === 0) c.moveTo(hx, hy); else c.lineTo(hx, hy);
      }
      c.closePath();
    } else { // square
      c.rect(cx - r, cy - r, r * 2, r * 2);
    }
  }

  function getZoomVal() {
    return Math.max(10, parseInt(zoom ? zoom.value : '100', 10) || 100);
  }

  // Cross-Browser Guaranteed Photo Rendering with Centering Offset Math
  function drawCoverImage(cx0, cy0, cw, ch, zoomPct, ox, oy, rad) {
    if (!img || !img.width || !img.height) return;

    ctx.save();
    const safeZoom = Math.max(10, zoomPct || 100);
    const safeOx = isNaN(ox) ? 0.5 : ox;
    const safeOy = isNaN(oy) ? 0.5 : oy;
    const safeRad = isNaN(rad) ? 0 : rad;

    const scale = Math.max(cw / img.width, ch / img.height) * (safeZoom / 100);
    const dw = img.width * scale, dh = img.height * scale;

    // Calculate center offset with range for horizontal & vertical pan
    const centerX = cx0 + cw / 2 + (safeOx - 0.5) * cw * 1.4;
    const centerY = cy0 + ch / 2 + (safeOy - 0.5) * ch * 1.4;

    ctx.translate(centerX, centerY);
    ctx.rotate((safeRad * Math.PI) / 180);
    ctx.translate(-centerX, -centerY);

    const dx = centerX - dw / 2;
    const dy = centerY - dh / 2;

    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();

    if (isAnimeOverlay) {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = theme.accentA || '#ff5e62';
      ctx.globalAlpha = 0.12;
      ctx.fillRect(cx0, cy0, cw, ch);
      ctx.restore();
    }
  }

  function trackedText(text, cx, cy, font, color, spacing) {
    ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const chars = [...text];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let x = cx - total / 2;
    for (let i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], x, cy);
      x += widths[i] + spacing;
    }
  }

  // Format A: PFP Frame (Guaranteed Photo Render)
  function drawFormatA() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2, cy = H * 0.44, r = W * 0.34;

    if (img && img.width && img.height) {
      ctx.save();
      applyClipPath(ctx, cx, cy, r, shape);
      ctx.clip();
      drawCoverImage(cx - r, cy - r, r * 2, r * 2, getZoomVal(), offsetX, offsetY, rotationDeg);
      ctx.restore();
    }

    // Outer Glow Ring
    ctx.save();
    applyClipPath(ctx, cx, cy, r + 6, shape);
    ctx.lineWidth = 9; ctx.strokeStyle = theme.accentB; ctx.stroke();
    ctx.restore();

    // Ribbon
    const ribbonW = r * 1.68, ribbonH = 74, ribbonY = cy + r - ribbonH * 0.4;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.roundRect(cx - ribbonW / 2, ribbonY, ribbonW, ribbonH, ribbonH / 2);
    const rg = ctx.createLinearGradient(cx - ribbonW / 2, 0, cx + ribbonW / 2, 0);
    rg.addColorStop(0, theme.accentA); rg.addColorStop(1, theme.accentB);
    ctx.fillStyle = rg; ctx.fill();
    ctx.restore();

    trackedText('HH GOA 2026', cx, ribbonY + ribbonH / 2, '800 36px "Outfit", sans-serif', theme.inkOnAccent, 2);

    // Event Stamp Badge
    const capY = ribbonY + ribbonH + 48;
    const badgeText = fBadge.value || 'VERIFIED BUILDER';
    ctx.font = '800 20px "Outfit", sans-serif';
    const capW = ctx.measureText(badgeText).width + 54;
    ctx.roundRect(cx - capW / 2, capY - 22, capW, 44, 22);
    ctx.fillStyle = theme.capBg; ctx.fill();
    trackedText(badgeText, cx, capY + 1, '800 19px "Outfit", sans-serif', theme.capText, 3);
  }

  // Format B: VIP Builder Pass
  function drawFormatB() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const cardX = 60, cardY = 140, cardW = W - 120, cardH = H - 240;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40;
    ctx.roundRect(cardX, cardY, cardW, cardH, 36);
    ctx.fillStyle = 'rgba(18, 10, 35, 0.95)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = theme.accentB; ctx.stroke();
    ctx.restore();

    // Header Banner
    ctx.roundRect(cardX + 24, cardY + 24, cardW - 48, 76, 20);
    const hg = ctx.createLinearGradient(cardX, 0, cardX + cardW, 0);
    hg.addColorStop(0, theme.accentA); hg.addColorStop(1, theme.accentB);
    ctx.fillStyle = hg; ctx.fill();

    trackedText('HACKER HOUSE GOA 2026', W / 2, cardY + 62, '800 28px "Outfit", sans-serif', theme.inkOnAccent, 2);

    // Avatar
    const pR = 145, pCx = W / 2, pCy = cardY + 250;
    if (img && img.width && img.height) {
      ctx.save();
      applyClipPath(ctx, pCx, pCy, pR, shape);
      ctx.clip();
      drawCoverImage(pCx - pR, pCy - pR, pR * 2, pR * 2, getZoomVal(), offsetX, offsetY, rotationDeg);
      ctx.restore();
    }
    ctx.save();
    applyClipPath(ctx, pCx, pCy, pR + 3, shape);
    ctx.lineWidth = 5; ctx.strokeStyle = theme.accentB; ctx.stroke();
    ctx.restore();

    // Name & Role
    const name = (fName.value || 'YOUR NAME').toUpperCase();
    ctx.font = '900 40px "Outfit", sans-serif'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
    ctx.fillText(name, W / 2, pCy + pR + 70);

    const role = (fRole.value || 'FULLSTACK BUILDER').toUpperCase();
    trackedText(role, W / 2, pCy + pR + 118, '800 22px "Outfit", sans-serif', theme.accentB, 3);

    // Serial
    ctx.font = '700 16px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('PASS ID: HH-GOA-2026-8492', W / 2, cardY + cardH - 45);
  }

  function draw() {
    if (mode === 'A') drawFormatA();
    else drawFormatB();
  }

  function exportCanvas() {
    const out = document.createElement('canvas');
    out.width = canvas.width; out.height = canvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(bgCanvas, 0, 0);
    octx.drawImage(canvas, 0, 0);
    return out;
  }

  // Actions
  document.getElementById('downloadBtn').addEventListener('click', () => {
    exportCanvas().toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `hh-goa-2026-${mode === 'A' ? 'pfp-frame' : 'builder-pass'}.png`;
      a.click();
      showToast('Downloaded PNG!');
    }, 'image/png', 1);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const caption = `Building at HH Goa 2026! 🌴 Check out my PFP frame: ${DEPLOYMENT_URL} #FrameInGoa #HHGoa2026`;

    exportCanvas().toBlob(async blob => {
      const file = new File([blob], 'hh-goa-2026.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], text: caption, title: 'HH Goa 2026' });
          return;
        } catch(err) { /* fall through */ }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hh-goa-2026.png';
      a.click();
      const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(caption);
      setTimeout(() => window.open(intent, '_blank'), 400);
      showToast('Downloaded graphic — opening X post!');
    }, 'image/png', 1);
  });

  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    const caption = `Building at HH Goa 2026! 🌴 Check out my PFP frame: ${DEPLOYMENT_URL} #FrameInGoa #HHGoa2026`;
    navigator.clipboard.writeText(caption).then(() => {
      showToast('Copied caption & link!');
    }).catch(() => showToast('Failed to copy'));
  });

})();
</script>
</body>
