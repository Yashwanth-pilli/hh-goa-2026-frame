    --amber: #ffb648;
    --coral: #ff5e62;
    --gold: #ffe082;
    --teal: #00f2fe;
    --deep: #160724;
    --card: rgba(22, 10, 36, 0.92);
    --border: rgba(255, 182, 72, 0.35);
    --ink: #fdf8ff;
    --muted: #bdaece;
    --ease: cubic-bezier(.22, 1, .36, 1);

       (syncAmbient), so the margins shift from bright/sunny to
       dusk/night instead of staying one fixed static palette. */
    --vibe1: #ff5e62;
    --vibe2: #ffb648;
    --vibe3: rgba(10, 60, 75, 0.95);
    --vibe4: #f6ce9d;
    --vibe-glow: #ffd175;

  html, body { margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(165deg, #12061e 0%, #2b0c3f 35%, #611e4f 70%, #d6544a 100%);

    overflow-x: hidden;
  }

  .wrap { max-width: 490px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 12px; }

  .badge {

    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 900;
    margin: 0 0 2px;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 30%, var(--amber) 70%, #ff8c52 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { color: var(--muted); font-size: 13px; margin: 0; }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    backdrop-filter: blur(12px);

  .tab {

    padding: 14px;

    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s var(--ease);

  .btn-upload:hover, .btn-camera:hover {
    border-color: var(--amber);
    background: rgba(255, 182, 72, 0.25);
    color: var(--amber);
  }
  input[type=file] { display: none; }

  .opt-row {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .shapes-row {
    display: flex;
    gap: 4px;
    flex: 1;

  .shape-btn {

    border-radius: 8px;

    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);

    display: none;
    align-items: center;

  .modal.show { display: flex; }

  .modal-card {
    background: #180a2b;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    width: 100%;

  .toast {
    position: fixed;
    left: 50%;

    transform: translateX(-50%) translateY(10px);
    background: #120924;
    border: 1px solid var(--amber);
    color: #fff;

    transition: all 0.25s var(--ease);
    z-index: 300;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Ambient backdrop: on wide screens the centered 490px card leaves big
     flat margins either side — drifting blobs + twinkling stars + a shore
     glow keep that space alive, and all of it is tinted live from the
     active vibe/theme (see syncAmbient in the script) instead of one
     fixed static palette: sunny vibes read bright, night vibes read deep
     and cool. Pure CSS, no canvas cost. */
  .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .ambient-bg .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.4; animation: driftBlob ease-in-out infinite alternate; transition: background-color 1.4s ease; }
  .ambient-bg .b1 { width: 460px; height: 460px; background: var(--vibe1); top: -12%; left: -10%; animation-duration: 26s; }
  .ambient-bg .b2 { width: 400px; height: 400px; background: var(--vibe3); bottom: -14%; right: -8%; animation-duration: 32s; animation-delay: -8s; }
  .ambient-bg .b3 { width: 320px; height: 320px; background: var(--vibe2); top: 38%; right: 6%; animation-duration: 22s; animation-delay: -4s; }
  .ambient-bg .b4 { width: 320px; height: 320px; background: var(--vibe4); bottom: 30%; left: 4%; animation-duration: 28s; animation-delay: -14s; }
  @keyframes driftBlob { from { transform: translate(0, 0) scale(1); } to { transform: translate(50px, -40px) scale(1.18); } }
  .ambient-bg .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 8% 12%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 22% 68%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 35% 22%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 48% 78%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 62% 15%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 74% 55%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 85% 30%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 92% 72%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 15% 45%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 55% 40%, #fff, transparent);
    background-repeat: no-repeat;
    animation: twinkleStars 5s ease-in-out infinite alternate;
  }
  @keyframes twinkleStars { 0% { opacity: 0.25; } 50% { opacity: 0.85; } 100% { opacity: 0.35; } }

  /* Shore glow — a warm reflection band low on the page, like light
     spilling across water at dusk/night in the reference mood. */
  .ambient-bg .horizon {
    position: absolute; left: -10%; right: -10%; bottom: -6%; height: 220px;
    background: radial-gradient(ellipse at center, var(--vibe-glow) 0%, transparent 72%);
    opacity: 0.32; filter: blur(20px);
    transition: background-color 1.4s ease;
    animation: shimmerHorizon 6s ease-in-out infinite alternate;
  }
  @keyframes shimmerHorizon { 0% { opacity: 0.22; } 100% { opacity: 0.4; } }

  /* Palm silhouettes framing the corners, echoing the reference's foreground
     fronds. Static/decorative — dark regardless of vibe. */
  .ambient-bg .palm { position: absolute; width: 220px; height: 220px; opacity: 0.5; }
  .ambient-bg .palm-tl { top: -40px; left: -40px; }
  .ambient-bg .palm-br { bottom: -50px; right: -50px; transform: rotate(180deg); }
  .ambient-bg .palm span {
    position: absolute; top: 50%; left: 50%; width: 140px; height: 46px;
    background: rgba(8, 4, 14, 0.85);
    border-radius: 0 100% 0 100%;
    transform-origin: 0% 50%;
  }
  .ambient-bg .palm span:nth-child(1) { transform: rotate(-15deg); }
  .ambient-bg .palm span:nth-child(2) { transform: rotate(20deg); }
  .ambient-bg .palm span:nth-child(3) { transform: rotate(55deg); }
  .ambient-bg .palm span:nth-child(4) { transform: rotate(90deg); }

  .wrap { position: relative; z-index: 1; }
</style>
</head>

  // UNIVERSAL ROUNDRECT POLYFILL TO PREVENT MOBILE CANVAS CRASHES
  function drawRoundRect(c, x, y, w, h, r) {
    if (c.roundRect) {
      c.beginPath();
      c.roundRect(x, y, w, h, r);
      return;
    }
    const rad = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.arcTo(x + w, y, x + w, y + rad, rad);
    c.lineTo(x + w, y + h - rad);
    c.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    c.lineTo(x + rad, y + h);
    c.arcTo(x, y + h, x, y + h - rad, rad);
    c.lineTo(x, y + rad);
    c.arcTo(x, y, x + rad, y, rad);
    c.closePath();
  }

  const THEMES = [
    {
      name: 'Goa Sunset Anime',
      sky: ['#17072b', '#3b1049', '#7e2454', '#c94457', '#ff7d4e', '#ffca7a'],

      capBg: 'rgba(14, 7, 24, 0.95)', capText: '#ffe8c7',

  // 3x3 sharpen convolution. ponytail: skip above ~2MP — the photo gets
  // cover-scaled way down into the frame anyway, so sharpening a raw 12MP
  // phone photo is wasted CPU for a difference nobody will see.
  function sharpenCanvas(sctx, w, h) {
    if (w * h > 2000000) return;
    const imgData = sctx.getImageData(0, 0, w, h);
    const src = imgData.data;
    const out = new Uint8ClampedArray(src.length);
    const k = [0, -1, 0, -1, 5, -1, 0, -1, 0];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) {
          out[i] = src[i]; out[i + 1] = src[i + 1]; out[i + 2] = src[i + 2]; out[i + 3] = src[i + 3];
          continue;
        }
        for (let c = 0; c < 3; c++) {
          let sum = 0, ki = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              sum += src[((y + dy) * w + (x + dx)) * 4 + c] * k[ki++];
            }
          }
          out[i + c] = sum;
        }
        out[i + 3] = src[i + 3];
      }
    }
    imgData.data.set(out);
    sctx.putImageData(imgData, 0, 0);
  }

  // Samples the photo at low-res to check if it's dull (dark / low contrast)
  // or blurry (low edge energy), and if so returns a full-res enhanced
  // version as a data URL. Returns null when the photo is already fine —
  // no point re-encoding a photo that doesn't need it.
  function enhancePhotoIfNeeded(image) {
    const w = image.width, h = image.height;
    if (!w || !h) return null;
    const s = 64;
    const sc = document.createElement('canvas'); sc.width = s; sc.height = s;
    const scx = sc.getContext('2d');
    scx.drawImage(image, 0, 0, s, s);
    const data = scx.getImageData(0, 0, s, s).data;
    const gray = new Float32Array(s * s);
    let sum = 0;
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      sum += gray[p];
    }
    const mean = sum / gray.length;
    let sumSq = 0;
    for (let p = 0; p < gray.length; p++) sumSq += (gray[p] - mean) ** 2;
    const stddev = Math.sqrt(sumSq / gray.length);

    let edgeSum = 0, edgeCount = 0;
    for (let y = 1; y < s - 1; y++) {
      for (let x = 1; x < s - 1; x++) {
        const idx = y * s + x;
        edgeSum += Math.abs(4 * gray[idx] - gray[idx - 1] - gray[idx + 1] - gray[idx - s] - gray[idx + s]);
        edgeCount++;
      }
    }
    const edgeAvg = edgeSum / edgeCount;

    const isDull = mean < 95 || stddev < 32;
    const isBlurry = edgeAvg < 6;
    if (!isDull && !isBlurry) return null;

    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const octx = out.getContext('2d');

    if (isDull) {
      const brightBoost = mean < 70 ? 1.35 : mean < 95 ? 1.18 : 1.0;
      const contrastBoost = stddev < 32 ? 1.25 : 1.0;
      octx.filter = `brightness(${brightBoost}) contrast(${contrastBoost}) saturate(1.12)`;
    }
    octx.drawImage(image, 0, 0, w, h);
    octx.filter = 'none';

    if (isBlurry) sharpenCanvas(octx, w, h);

    return out.toDataURL('image/jpeg', 0.92);
  }

  // Runs the photo through enhancePhotoIfNeeded and hands the (possibly
  // improved) image to onReady. Falls back to the original on any failure —
  // enhancement is a nice-to-have, never a reason to block the upload.
  function loadWithEnhance(sourceImage, onReady) {
    let enhancedUrl = null;
    try { enhancedUrl = enhancePhotoIfNeeded(sourceImage); } catch (e) { enhancedUrl = null; }
    if (!enhancedUrl) { onReady(sourceImage, false); return; }
    const enhImg = new Image();
    enhImg.onload = () => onReady(enhImg, true);
    enhImg.onerror = () => onReady(sourceImage, false);
    enhImg.src = enhancedUrl;
  }

  // Pre-rendered High Quality Demo Builder Avatar Image
  function createSampleBuilderImage() {
    const c = document.createElement('canvas');
    c.width = 600; c.height = 600;
    const cx = c.getContext('2d');

    const g = cx.createLinearGradient(0, 0, 600, 600);
    g.addColorStop(0, '#2d0c4e'); g.addColorStop(0.5, '#7a1d5c'); g.addColorStop(1, '#ff6b4a');
    cx.fillStyle = g; cx.fillRect(0, 0, 600, 600);

    cx.lineWidth = 4; cx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    cx.beginPath(); cx.arc(300, 300, 220, 0, Math.PI * 2); cx.stroke();

    cx.fillStyle = '#ffb648';
    cx.beginPath(); cx.ellipse(300, 520, 180, 120, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#1a082b';
    cx.beginPath(); cx.ellipse(300, 530, 140, 90, 0, 0, Math.PI * 2); cx.fill();

    cx.fillStyle = '#fce0c0'; cx.fillRect(260, 340, 80, 80);
    cx.fillStyle = '#ffe5ca'; cx.beginPath(); cx.ellipse(300, 270, 110, 130, 0, 0, Math.PI * 2); cx.fill();

    cx.fillStyle = '#ff3b6b';
    cx.beginPath(); cx.arc(300, 220, 120, Math.PI, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.moveTo(200, 220); cx.lineTo(240, 280); cx.lineTo(260, 230); cx.lineTo(290, 290); cx.lineTo(310, 230); cx.lineTo(350, 285); cx.lineTo(400, 220); cx.fill();

    cx.fillStyle = '#110424'; drawRoundRect(cx, 220, 250, 160, 55, 14); cx.fill();
    cx.lineWidth = 3; cx.strokeStyle = '#00f2fe'; cx.stroke();
    const lg = cx.createLinearGradient(220, 250, 380, 305);
    lg.addColorStop(0, 'rgba(0, 242, 254, 0.7)'); lg.addColorStop(0.5, 'rgba(255, 46, 196, 0.7)'); lg.addColorStop(1, 'transparent');
    cx.fillStyle = lg; drawRoundRect(cx, 224, 254, 152, 47, 10); cx.fill();

    cx.lineWidth = 4; cx.strokeStyle = '#853216';
    cx.beginPath(); cx.arc(300, 335, 20, 0.1, Math.PI - 0.1); cx.stroke();

    const sampleImg = new Image();
    sampleImg.onload = () => {
      if (!img) {
        img = sampleImg;
        draw();
      }
    };
    sampleImg.src = c.toDataURL();
  }
  createSampleBuilderImage();

  function autoDetectVibeOnUpload(image) {
    try {
      const s = 16;
      const c = document.createElement('canvas'); c.width = s; c.height = s;
      const cx = c.getContext('2d');
      cx.drawImage(image, 0, 0, s, s);
      const data = cx.getImageData(0, 0, s, s).data;

      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
      }
      r /= count; g /= count; b /= count;
      const brightness = (r + g + b) / 3;
      const warmth = r - b;

      let selectedIndex = 0;
      if (b > r && b > g) selectedIndex = 1;
      else if (g > r && g > b) selectedIndex = 2;
      else if (warmth > 20 && brightness > 120) selectedIndex = 3;
      else selectedIndex = 0;

      theme = THEMES[selectedIndex];
      syncAmbient(theme);
      isAnimeOverlay = true;
      vibeName.textContent = theme.name;
      vibeTag.style.display = 'block';

      swatchEls.forEach((sw, idx) => sw.classList.toggle('active', idx === selectedIndex));
    } catch(e) { /* fallback */ }
  }

  // Camera Selfie Logic

  async function handleFile(file) {
    if (!file) return;
    let blob = file;
    if (/heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name)) {
      showToast('Converting HEIC…');
      try { blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 }); }
      catch(err) { showToast('Could not read HEIC — try JPG/PNG'); return; }
    }
    const reader = new FileReader();
    reader.onerror = () => showToast('Could not read that file — try another');
    reader.onload = (evt) => {
      const loadedImage = new Image();
      loadedImage.onload = () => {
        loadWithEnhance(loadedImage, (finalImage, wasEnhanced) => {
          img = finalImage;
          autoDetectVibeOnUpload(finalImage);
          offsetX = 0.5; offsetY = 0.5;
          zoom.value = 100; posX.value = 0; posY.value = 0; rot.value = 0;
          draw();
          showToast(wasEnhanced ? 'Photo Uploaded — Enhanced ✨' : 'Photo Uploaded!');
        });
      };
      // Without this, an image that fails to decode (corrupt file, unsupported
      // codec) fails silently: onload never fires, img never updates, nothing
      // renders, and the user sees no error at all.
      loadedImage.onerror = () => showToast('Could not load that photo — try a different file');
      loadedImage.src = evt.target.result;
    };
    reader.readAsDataURL(blob);
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    dragStart = { p: pointerPos(e), ox: offsetX, oy: offsetY };
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = pointerPos(e);
    const dx = p.x - dragStart.p.x, dy = p.y - dragStart.p.y;
    offsetX = Math.min(1, Math.max(0, dragStart.ox + dx * 1.2));
    offsetY = Math.min(1, Math.max(0, dragStart.oy + dy * 1.2));
    posX.value = Math.round(offsetX * 200 - 100);
    posY.value = Math.round(offsetY * 200 - 100);

  window.addEventListener('pointerup', () => dragging = false);

  function drawSunsetPalmScene(t) {
    const w = bgCanvas.width, h = bgCanvas.height;
    const s = theme.sky;
    const g = bgCtx.createLinearGradient(0, 0, 0, h);
    s.forEach((col, idx) => g.addColorStop(idx / (s.length - 1), col));
    bgCtx.fillStyle = g; bgCtx.fillRect(0, 0, w, h);

    // Sun / moon glow
    const sunX = w * 0.76, sunY = h * 0.22;
    const sg = bgCtx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 160);
    sg.addColorStop(0, theme.orb[0]); sg.addColorStop(0.4, theme.orb[1]); sg.addColorStop(1, 'transparent');
    bgCtx.fillStyle = sg; bgCtx.beginPath(); bgCtx.arc(sunX, sunY, 160, 0, Math.PI * 2); bgCtx.fill();

    // Drifting night clouds
    bgCtx.save();
    bgCtx.fillStyle = 'rgba(255,255,255,0.10)';
    for (let i = 0; i < 4; i++) {
      const speed = 5 + i * 3.4;
      const baseY = h * (0.1 + i * 0.085);
      const cw = w * (0.24 + (i % 2) * 0.09);
      const cx0 = ((t * speed + i * 260) % (w + cw)) - cw;
      bgCtx.beginPath();
      bgCtx.ellipse(cx0, baseY, cw * 0.5, cw * 0.16, 0, 0, Math.PI * 2);
      bgCtx.ellipse(cx0 + cw * 0.3, baseY + cw * 0.05, cw * 0.32, cw * 0.13, 0, 0, Math.PI * 2);
      bgCtx.fill();
    }
    bgCtx.restore();

    // Sea
    const seaY = h * 0.72;
    bgCtx.fillStyle = theme.water[0]; bgCtx.fillRect(0, seaY, w, h - seaY);

    // Sand
    const sandY = h * 0.88;
    const sgSand = bgCtx.createLinearGradient(0, sandY, 0, h);
    sgSand.addColorStop(0, theme.sand[0]); sgSand.addColorStop(1, theme.sand[1]);
    bgCtx.fillStyle = sgSand; bgCtx.fillRect(0, sandY, w, h - sandY);

    // Animated wave shimmer riding the sea band
    bgCtx.save();
    bgCtx.strokeStyle = 'rgba(255,255,255,0.24)';
    bgCtx.lineWidth = 2;
    for (let wLine = 0; wLine < 3; wLine++) {
      const wy = seaY + 14 + wLine * 15;
      bgCtx.beginPath();
      for (let x = 0; x <= w; x += 14) {
        const py = wy + Math.sin(x / 42 + t * 1.7 + wLine * 1.3) * 4;
        if (x === 0) bgCtx.moveTo(x, py); else bgCtx.lineTo(x, py);
      }
      bgCtx.globalAlpha = 0.55 - wLine * 0.14;
      bgCtx.stroke();
    }
    bgCtx.restore();
  }

  let animStart = null;
  let carT = 0;
  function animFrame(now) {

    requestAnimationFrame(animFrame);

  function applyClipPath(c, cx, cy, r, shapeType) {
    c.beginPath();
    if (shapeType === 'circle') {
      c.arc(cx, cy, r, 0, Math.PI * 2);
    } else if (shapeType === 'rounded') {
      drawRoundRect(c, cx - r, cy - r, r * 2, r * 2, 40);
    } else if (shapeType === 'hexagon') {
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI / 3) - Math.PI / 6;
        const hx = cx + r * Math.cos(a);
        const hy = cy + r * Math.sin(a);
        if (i === 0) c.moveTo(hx, hy); else c.lineTo(hx, hy);
      }
      c.closePath();
    } else { // square
      c.rect(cx - r, cy - r, r * 2, r * 2);
    }
  }

  function getZoomVal() {
    return Math.max(10, parseInt(zoom ? zoom.value : '100', 10) || 100);
  }

  // FAIL-SAFE PHOTO DRAWING INSIDE CLIPPED SHAPE
  function drawCoverImage(cx0, cy0, cw, ch, zoomPct, ox, oy, rad) {
    if (!img || !img.width || !img.height) return;

    ctx.save();
    const safeZoom = Math.max(10, zoomPct || 100);
    const safeOx = isNaN(ox) ? 0.5 : ox;
    const safeOy = isNaN(oy) ? 0.5 : oy;
    const safeRad = isNaN(rad) ? 0 : rad;

    const scale = Math.max(cw / img.width, ch / img.height) * (safeZoom / 100);
    const dw = img.width * scale, dh = img.height * scale;

    const centerX = cx0 + cw / 2 + (safeOx - 0.5) * cw * 1.4;
    const centerY = cy0 + ch / 2 + (safeOy - 0.5) * ch * 1.4;

    ctx.translate(centerX, centerY);
    ctx.rotate((safeRad * Math.PI) / 180);
    ctx.translate(-centerX, -centerY);

    const dx = centerX - dw / 2;
    const dy = centerY - dh / 2;

    ctx.drawImage(img, dx, dy, dw, dh);

    if (isAnimeOverlay) {
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = theme.accentA || '#ff5e62';
      ctx.globalAlpha = 0.12;
      ctx.fillRect(dx, dy, dw, dh);
    }

    ctx.restore();
  }

  function drawOutlineText(text, cx, cy, fontStr, fillColor, strokeColor, strokeWidth) {
    ctx.save();
    ctx.font = fontStr;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (strokeColor && strokeWidth) {
      ctx.lineWidth = strokeWidth;
      ctx.strokeStyle = strokeColor;
      ctx.lineJoin = 'round';
      ctx.strokeText(text, cx, cy);
    }

    ctx.fillStyle = fillColor;
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  function drawWindStreaks(x0, y0, w, laneGap, phase) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const ly = y0 + i * laneGap;
      const len = w * (0.16 + (i % 3) * 0.05);
      const off = ((phase * (60 + i * 12)) % (w + len)) - len;
      ctx.globalAlpha = 0.5 * (0.4 + 0.6 * Math.sin(i + phase));
      ctx.lineWidth = 3.5 - (i % 3) * 0.5;
      ctx.beginPath();
      ctx.moveTo(x0 + w - off, ly);
      ctx.lineTo(x0 + w - off - len, ly);
      ctx.stroke();
    }
    ctx.restore();
  }

  // "Driving through Goa" scene: uploaded photo rides in an open-top jeep at
  // golden hour, road + wind streaks + wheels scroll/spin via carT. Sized to
  // fill the caller's full frame (not a small centered box) so there's no
  // mismatched strip of the plain sunset background showing around it.
  function drawCarScene(sceneCx, sceneTop, sceneW, sceneH, t) {
    const sx = sceneCx - sceneW / 2, sy = sceneTop;

    ctx.save();
    drawRoundRect(ctx, sx, sy, sceneW, sceneH, 28);
    ctx.clip();

    const skyG = ctx.createLinearGradient(sx, sy, sx, sy + sceneH);
    skyG.addColorStop(0, theme.sky[0]); skyG.addColorStop(0.55, theme.sky[2]); skyG.addColorStop(1, theme.sky[4] || theme.sky[3]);
    ctx.fillStyle = skyG;
    ctx.fillRect(sx, sy, sceneW, sceneH * 0.76);

    // Big low sun, dead center behind the jeep, with light rays for a
    // golden-hour backlight instead of a flat corner glow.
    const roadY0 = sy + sceneH * 0.76;
    const sunX = sx + sceneW * 0.5, sunY = roadY0 - sceneH * 0.05;
    ctx.save();
    ctx.globalAlpha = 0.85;
    for (let ray = 0; ray < 10; ray++) {
      const a = (ray / 10) * Math.PI * 2 + t * 0.08;
      const len = sceneW * (0.5 + 0.12 * Math.sin(ray * 2 + t));
      const rg = ctx.createLinearGradient(sunX, sunY, sunX + Math.cos(a) * len, sunY + Math.sin(a) * len);
      rg.addColorStop(0, 'rgba(255,235,180,0.28)'); rg.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.strokeStyle = rg; ctx.lineWidth = sceneW * 0.02;
      ctx.beginPath(); ctx.moveTo(sunX, sunY); ctx.lineTo(sunX + Math.cos(a) * len, sunY + Math.sin(a) * len); ctx.stroke();
    }
    ctx.restore();
    const sunR = sceneW * 0.26;
    const sunG = ctx.createRadialGradient(sunX, sunY, sunR * 0.05, sunX, sunY, sunR);
    sunG.addColorStop(0, '#fff8e0'); sunG.addColorStop(0.5, theme.orb[1] || '#ffd175'); sunG.addColorStop(1, 'transparent');
    ctx.fillStyle = sunG;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = theme.water[0];
    ctx.fillRect(sx, sy + sceneH * 0.6, sceneW, sceneH * 0.16);

    const roadY = roadY0;
    const roadG = ctx.createLinearGradient(sx, roadY, sx, sy + sceneH);
    roadG.addColorStop(0, 'rgba(46,30,44,0.95)'); roadG.addColorStop(1, 'rgba(18,10,20,0.97)');
    ctx.fillStyle = roadG;
    ctx.fillRect(sx, roadY, sceneW, sceneH - (roadY - sy));

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = Math.max(3, sceneH * 0.018);
    ctx.setLineDash([sceneW * 0.07, sceneW * 0.05]);
    ctx.lineDashOffset = -(t * 110) % (sceneW * 0.12);
    ctx.beginPath();
    const laneY = roadY + (sceneH - (roadY - sy)) * 0.55;
    ctx.moveTo(sx, laneY); ctx.lineTo(sx + sceneW, laneY);
    ctx.stroke();
    ctx.setLineDash([]);

    drawWindStreaks(sx, sy + sceneH * 0.32, sceneW * 0.34, sceneH * 0.05, t * 1.8);

    // --- Open-top jeep, side view ---
    const bodyW = sceneW * 0.62, bodyH = sceneH * 0.22;
    const bob = Math.sin(t * 2.4) * (sceneH * 0.006);
    const carX = sx + sceneW * 0.5 - bodyW / 2;
    const carY = roadY - bodyH * 0.5 + bob;
    const wheelR = bodyH * 0.5, wAY = carY + bodyH * 0.86;

    // Dust puffs kicked up behind the rear wheel
    ctx.save();
    for (let d = 0; d < 3; d++) {
      const dp = ((t * 70 + d * 40) % 130);
      ctx.globalAlpha = Math.max(0, 0.22 - dp * 0.0018);
      ctx.fillStyle = '#e8d8b8';
      ctx.beginPath();
      ctx.ellipse(carX - dp * 0.8, wAY + wheelR * 0.3, wheelR * (0.5 + dp * 0.01), wheelR * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Contact shadow — grounds the jeep on the road instead of it floating
    ctx.save();
    const shadowG = ctx.createRadialGradient(carX + bodyW * 0.5, wAY + wheelR * 0.55, wheelR * 0.2, carX + bodyW * 0.5, wAY + wheelR * 0.55, bodyW * 0.62);
    shadowG.addColorStop(0, 'rgba(0,0,0,0.55)'); shadowG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadowG;
    ctx.beginPath(); ctx.ellipse(carX + bodyW * 0.5, wAY + wheelR * 0.55, bodyW * 0.62, wheelR * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    [carX + bodyW * 0.2, carX + bodyW * 0.82].forEach(wx => {
      ctx.save();
      const tireG = ctx.createRadialGradient(wx - wheelR * 0.3, wAY - wheelR * 0.3, wheelR * 0.1, wx, wAY, wheelR);
      tireG.addColorStop(0, '#4a3d52'); tireG.addColorStop(0.7, '#2f2436'); tireG.addColorStop(1, '#17111c');
      ctx.fillStyle = tireG;
      ctx.beginPath(); ctx.arc(wx, wAY, wheelR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,238,190,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.translate(wx, wAY);
      ctx.rotate(t * 5.5);
      ctx.strokeStyle = 'rgba(20,15,25,0.85)';
      ctx.lineWidth = wheelR * 0.17;
      ctx.lineCap = 'round';
      for (let tread = 0; tread < 10; tread++) {
        const a = (tread * Math.PI * 2) / 10;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * wheelR * 0.86, Math.sin(a) * wheelR * 0.86);
        ctx.lineTo(Math.cos(a) * wheelR * 0.98, Math.sin(a) * wheelR * 0.98);
        ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.translate(wx, wAY);
      const rimG = ctx.createRadialGradient(-wheelR * 0.15, -wheelR * 0.15, wheelR * 0.05, 0, 0, wheelR * 0.44);
      rimG.addColorStop(0, '#fdf6e3'); rimG.addColorStop(0.55, theme.accentB || '#ffb648'); rimG.addColorStop(1, '#8a5a1f');
      ctx.fillStyle = rimG;
      ctx.beginPath(); ctx.arc(0, 0, wheelR * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(40,30,20,0.85)';
      for (let spoke = 0; spoke < 5; spoke++) {
        const a = (spoke * Math.PI * 2) / 5;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * wheelR * 0.24, Math.sin(a) * wheelR * 0.24, wheelR * 0.08, wheelR * 0.14, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#241a30';
      ctx.beginPath(); ctx.arc(0, 0, wheelR * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // Chassis — glossy multi-stop paint gradient + specular streak, not a flat fill
    const chassisPath = () => {
      ctx.beginPath();
      ctx.moveTo(carX, carY + bodyH);
      ctx.lineTo(carX, carY + bodyH * 0.35);
      ctx.lineTo(carX + bodyW * 0.14, carY + bodyH * 0.1);
      ctx.lineTo(carX + bodyW * 0.86, carY + bodyH * 0.1);
      ctx.lineTo(carX + bodyW * 0.98, carY + bodyH * 0.42);
      ctx.lineTo(carX + bodyW, carY + bodyH * 0.42);
      ctx.lineTo(carX + bodyW, carY + bodyH);
      ctx.closePath();
    };
    const chassisG = ctx.createLinearGradient(carX, carY, carX, carY + bodyH);
    chassisG.addColorStop(0, theme.accentB || '#ffb648');
    chassisG.addColorStop(0.32, '#fff2cf');
    chassisG.addColorStop(0.42, theme.accentB || '#ffb648');
    chassisG.addColorStop(1, theme.accentA || '#ff5e62');
    ctx.fillStyle = chassisG;
    chassisPath();
    ctx.fill();
    ctx.save();
    chassisPath();
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(carX, carY + bodyH * 0.75, bodyW, bodyH * 0.3);
    ctx.restore();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#2a1c10'; ctx.globalAlpha = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
    // Door crease line for panel detail
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(carX + bodyW * 0.5, carY + bodyH * 0.18);
    ctx.lineTo(carX + bodyW * 0.5, carY + bodyH * 0.9);
    ctx.stroke();
    // Warm rim-light along the top edge, backlit by the sun behind it
    ctx.strokeStyle = 'rgba(255,238,190,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(carX + bodyW * 0.14, carY + bodyH * 0.1);
    ctx.lineTo(carX + bodyW * 0.86, carY + bodyH * 0.1);
    ctx.stroke();

    // Roll bar — brushed-metal gradient tube (open-top arch, no roof).
    // Taller than a real 4x4's bar on purpose: it's what buys headroom for
    // a big, clearly-visible driver photo instead of a small one low down.
    const barX0 = carX + bodyW * 0.2, barX1 = carX + bodyW * 0.82;
    const barTopY = carY - bodyH * 1.05;
    ctx.save();
    const barG = ctx.createLinearGradient(barX0, 0, barX1, 0);
    barG.addColorStop(0, '#0f0a16'); barG.addColorStop(0.5, '#4a3d52'); barG.addColorStop(0.6, '#e8ddf0'); barG.addColorStop(0.72, '#4a3d52'); barG.addColorStop(1, '#0f0a16');
    ctx.strokeStyle = barG;
    ctx.lineWidth = bodyH * 0.13;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(barX0, carY + bodyH * 0.15);
    ctx.lineTo(barX0, barTopY);
    ctx.lineTo(barX1, barTopY);
    ctx.lineTo(barX1, carY + bodyH * 0.15);
    ctx.stroke();
    // Bolt joints where the bar meets the body
    ctx.fillStyle = '#e8ddf0';
    [barX0, barX1].forEach(bx => {
      ctx.beginPath(); ctx.arc(bx, carY + bodyH * 0.15, bodyH * 0.05, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // Side mirror
    ctx.save();
    ctx.fillStyle = '#241a30';
    drawRoundRect(ctx, carX + bodyW * 0.16, carY + bodyH * 0.02, bodyW * 0.05, bodyH * 0.14, bodyH * 0.03);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();

    // Driver photo — sized and centered in the open cabin first; the
    // headrest frame is then fit AROUND it, so the two can never mismatch
    // and leave dead space (previous bug: headrest was sized independently
    // and taller than the circle, leaving empty black space above it).
    const seatCx = carX + bodyW * 0.5;
    const winCx = seatCx, winCy = barTopY + (carY - barTopY) * 0.5;
    const winR = Math.min(bodyW * 0.42, (carY - barTopY) * 0.46);

    ctx.fillStyle = 'rgba(10,6,16,0.9)';
    drawRoundRect(ctx, winCx - winR * 1.16, winCy - winR * 1.08, winR * 2.32, winR * 2.18, winR * 0.4);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(winCx, winCy, winR, 0, Math.PI * 2);
    ctx.clip();
    if (img && img.complete && img.width > 0) {
      drawCoverImage(winCx - winR, winCy - winR, winR * 2, winR * 2, getZoomVal(), offsetX, offsetY, rotationDeg);
    } else {
      ctx.fillStyle = '#3a1259';
      ctx.fillRect(winCx - winR, winCy - winR, winR * 2, winR * 2);
    }
    // Warm sunset light wash over the face, so it reads lit-from-behind
    const faceLight = ctx.createRadialGradient(winCx, winCy, winR * 0.2, winCx, winCy, winR);
    faceLight.addColorStop(0, 'rgba(255,220,160,0.22)'); faceLight.addColorStop(1, 'rgba(255,140,90,0.05)');
    ctx.fillStyle = faceLight;
    ctx.fillRect(winCx - winR, winCy - winR, winR * 2, winR * 2);
    // Soft rim vignette, like the photo sits recessed in a seat/frame
    const vignette = ctx.createRadialGradient(winCx, winCy, winR * 0.72, winCx, winCy, winR);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vignette;
    ctx.fillRect(winCx - winR, winCy - winR, winR * 2, winR * 2);
    // Diagonal glass-style sheen streak for a "behind glass" cue
    ctx.globalCompositeOperation = 'lighter';
    const sheen = ctx.createLinearGradient(winCx - winR, winCy - winR, winCx + winR * 0.2, winCy + winR * 0.2);
    sheen.addColorStop(0, 'rgba(255,255,255,0.28)'); sheen.addColorStop(0.25, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(winCx - winR, winCy - winR, winR * 2, winR * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(winCx, winCy, winR, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = theme.accentB || '#ffb648';
    ctx.beginPath(); ctx.arc(winCx, winCy, winR + 3, 0, Math.PI * 2); ctx.stroke();

    // Headlight + grille hint on the hood
    const hlG = ctx.createRadialGradient(carX + bodyW - 10, carY + bodyH * 0.56, 1, carX + bodyW - 8, carY + bodyH * 0.58, bodyH * 0.15);
    hlG.addColorStop(0, '#ffffff'); hlG.addColorStop(0.5, '#fff7d6'); hlG.addColorStop(1, 'rgba(255,231,140,0.15)');
    ctx.fillStyle = hlG;
    ctx.beginPath(); ctx.arc(carX + bodyW - 8, carY + bodyH * 0.58, bodyH * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7d6';
    ctx.beginPath(); ctx.arc(carX + bodyW - 8, carY + bodyH * 0.58, bodyH * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
    for (let gr = 0; gr < 3; gr++) {
      ctx.beginPath();
      ctx.moveTo(carX + bodyW * 0.88, carY + bodyH * (0.25 + gr * 0.15));
      ctx.lineTo(carX + bodyW * 0.97, carY + bodyH * (0.25 + gr * 0.15));
      ctx.stroke();
    }

    ctx.restore();

    ctx.save();
    drawRoundRect(ctx, sx, sy, sceneW, sceneH, 28);
    ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    drawRoundRect(ctx, sx, sy, sceneW, sceneH, 28);
    ctx.lineWidth = 2.5; ctx.strokeStyle = theme.accentB || '#ffb648'; ctx.stroke();
    ctx.restore();
  }

  // Format A: PFP Frame
  function drawFormatA() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2, cy = H * 0.44, r = W * 0.34;
    let carSceneBottom = null;

    if (shape === 'car') {
      const carSceneW = W * 0.94, carSceneTop = H * 0.06, carSceneH = H * 0.66;
      drawCarScene(cx, carSceneTop, carSceneW, carSceneH, carT);
      carSceneBottom = carSceneTop + carSceneH;
    } else {
    // 1. Photo Avatar
    ctx.save();
    applyClipPath(ctx, cx, cy, r, shape);
    ctx.clip();

    if (img && img.complete && img.width > 0) {
      drawCoverImage(cx - r, cy - r, r * 2, r * 2, getZoomVal(), offsetX, offsetY, rotationDeg);
    } else {
      const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      g.addColorStop(0, '#3a1259'); g.addColorStop(1, '#8c2662');
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.restore();

    // 2. Photo Frame Outer Rings (Pearl White + Gold Accent)
    ctx.save();
    applyClipPath(ctx, cx, cy, r + 6, shape);
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.stroke();
    applyClipPath(ctx, cx, cy, r + 4, shape);
    ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    applyClipPath(ctx, cx, cy, r, shape);
    ctx.lineWidth = 4; ctx.strokeStyle = theme.accentB || '#ffb648'; ctx.stroke();
    ctx.restore();
    }

    // 3. Vibrant Branding Ribbon (HH GOA 2026)
    const ribbonW = r * 1.68, ribbonH = 76;
    const ribbonY = carSceneBottom !== null ? carSceneBottom + 26 : cy + r - ribbonH * 0.45;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
    
    drawRoundRect(ctx, cx - ribbonW / 2, ribbonY, ribbonW, ribbonH, ribbonH / 2);
    const rg = ctx.createLinearGradient(cx - ribbonW / 2, 0, cx + ribbonW / 2, 0);
    rg.addColorStop(0, theme.accentA || '#ff5e62');
    rg.addColorStop(1, theme.accentB || '#ffb648');
    ctx.fillStyle = rg; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.restore();

    drawOutlineText('HH GOA 2026', cx, ribbonY + ribbonH / 2, 'bold 36px Arial, sans-serif', '#ffffff', '#000000', 8);

    // 4. Event Stamp Badge ("VERIFIED BUILDER")
    const capY = ribbonY + ribbonH + 46;
    const badgeText = fBadge.value || 'VERIFIED BUILDER';
    ctx.save();
    ctx.font = 'bold 18px Arial, sans-serif';
    const capW = ctx.measureText(badgeText).width + 48;
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 14;
    drawRoundRect(ctx, cx - capW / 2, capY - 20, capW, 40, 20);
    ctx.fillStyle = theme.capBg || '#100720'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = theme.accentB || '#ffb648'; ctx.stroke();
    ctx.restore();

    drawOutlineText(badgeText, cx, capY + 1, 'bold 18px Arial, sans-serif', theme.capText || '#ffe6c2', '#000000', 4);
  }

  // Format B: VIP Builder Pass
  function drawFormatB() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const cardX = 60, cardY = 140, cardW = W - 120, cardH = H - 240;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40;
    drawRoundRect(ctx, cardX, cardY, cardW, cardH, 36);
    ctx.fillStyle = 'rgba(18, 10, 35, 0.95)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = theme.accentB; ctx.stroke();
    ctx.restore();

    // Header Banner
    ctx.save();
    drawRoundRect(ctx, cardX + 22, cardY + 22, cardW - 44, 80, 22);
    const hg = ctx.createLinearGradient(cardX, 0, cardX + cardW, 0);
    hg.addColorStop(0, theme.accentA); hg.addColorStop(1, theme.accentB);
    ctx.fillStyle = hg; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.restore();

    drawOutlineText('HACKER HOUSE GOA 2026', W / 2, cardY + 62, 'bold 28px Arial, sans-serif', '#ffffff', '#000000', 6);

    // Avatar
    const pR = 145, pCx = W / 2, pCy = cardY + 255;
    let avatarBottomY;

    if (shape === 'car') {
      const carSceneW = cardW * 0.82, carSceneTop = cardY + 130, carSceneH = 430;
      drawCarScene(pCx, carSceneTop, carSceneW, carSceneH, carT);
      avatarBottomY = carSceneTop + carSceneH;
    } else {
    ctx.save();
    applyClipPath(ctx, pCx, pCy, pR, shape);
    ctx.clip();

    if (img && img.complete && img.width > 0) {
      drawCoverImage(pCx - pR, pCy - pR, pR * 2, pR * 2, getZoomVal(), offsetX, offsetY, rotationDeg);
    } else {
      const g = ctx.createLinearGradient(pCx - pR, pCy - pR, pCx + pR, pCy + pR);
      g.addColorStop(0, '#3a1259'); g.addColorStop(1, '#8c2662');
      ctx.fillStyle = g;
      ctx.fillRect(pCx - pR, pCy - pR, pR * 2, pR * 2);
    }
    ctx.restore();

    ctx.save();
    applyClipPath(ctx, pCx, pCy, pR + 5, shape);
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.stroke();
    applyClipPath(ctx, pCx, pCy, pR + 3, shape);
    ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.restore();
    avatarBottomY = pCy + pR;
    }

    // Name & Role
    const name = (fName.value || 'YOUR NAME').toUpperCase();
    drawOutlineText(name, W / 2, avatarBottomY + 70, 'bold 38px Arial, sans-serif', '#ffffff', '#000000', 6);

    const role = (fRole.value || 'FULLSTACK BUILDER').toUpperCase();
    drawOutlineText(role, W / 2, avatarBottomY + 118, 'bold 22px Arial, sans-serif', theme.accentB, '#000000', 4);

    // Ticket-stub divider (fills the dead space above the serial line)
    const divY = avatarBottomY + 172;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(cardX + 40, divY); ctx.lineTo(cardX + cardW - 40, divY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#120a20';
    [cardX, cardX + cardW].forEach(nx => {
      ctx.beginPath(); ctx.arc(nx, divY, 18, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    drawOutlineText('ANJUNA · GOA', W / 2, divY + 52, 'bold 20px Arial, sans-serif', 'rgba(255,255,255,0.85)', '#000000', 3);
    drawOutlineText('COASTAL TECH RESIDENCY', W / 2, divY + 84, 'bold 15px Arial, sans-serif', theme.accentB, '#000000', 2);

    // Wave doodle
    ctx.save();
    ctx.strokeStyle = theme.accentA || '#ff5e62';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const waveY = divY + 132, waveW = cardW * 0.46, waveX0 = W / 2 - waveW / 2;
    for (let i = 0; i <= 40; i++) {
      const px = waveX0 + (waveW * i) / 40;
      const py = waveY + Math.sin(i / 3) * 10;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    drawOutlineText('500 BUILDERS · FEB 2026', W / 2, divY + 180, 'bold 16px monospace', 'rgba(255,255,255,0.7)', '#000000', 2);

    // Serial
    drawOutlineText('PASS ID: HH-GOA-2026-8492', W / 2, cardY + cardH - 45, 'bold 16px monospace', 'rgba(255,255,255,0.85)', '#000000', 3);
  }

  function draw() {
    if (mode === 'A') drawFormatA();
    else drawFormatB();
  }

  function exportCanvas() {
    const out = document.createElement('canvas');
    out.width = canvas.width; out.height = canvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(bgCanvas, 0, 0);
    octx.drawImage(canvas, 0, 0);
    return out;
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    exportCanvas().toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `hh-goa-2026-${mode === 'A' ? 'pfp-frame' : 'builder-pass'}.png`;
      a.click();
      showToast('Downloaded PNG!');
    }, 'image/png', 1);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const caption = `Building at HH Goa 2026! 🌴 Check out my PFP frame: ${DEPLOYMENT_URL} #FrameInGoa #HHGoa2026`;

    exportCanvas().toBlob(async blob => {
      const file = new File([blob], 'hh-goa-2026.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], text: caption, title: 'HH Goa 2026' });
          return;
        } catch(err) { /* fall through */ }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hh-goa-2026.png';
      a.click();
      const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(caption);
      setTimeout(() => window.open(intent, '_blank'), 400);
      showToast('Downloaded graphic — opening X post!');
    }, 'image/png', 1);
  });

  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    const caption = `Building at HH Goa 2026! 🌴 Check out my PFP frame: ${DEPLOYMENT_URL} #FrameInGoa #HHGoa2026`;
    navigator.clipboard.writeText(caption).then(() => {
      showToast('Copied caption & link!');
    }).catch(() => showToast('Failed to copy'));
  });

  draw();
})();
</script>
</body>
</html>
